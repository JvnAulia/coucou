<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #mochi {
        position: absolute;
        left: 0;
        top: 0;
        width: 120px;
        height: 120px;
        transition: opacity 0.45s ease-in-out;
      }
      #bubble-container {
        position: absolute;
        box-sizing: border-box;
        pointer-events: auto;
        animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        z-index: 10;
      }
      #bubble-container.hidden {
        display: none !important;
      }
      #bubble-card {
        background: rgba(20, 20, 24, 0.90);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255, 255, 255, 0.3);
        padding: 10px 14px;
        box-sizing: border-box;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      #bubble-card:hover {
        border-color: rgba(255, 255, 255, 0.28);
      }
      #bubble-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #bubble-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.2px;
        line-height: 1.3;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      #bubble-close {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.45);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
        border-radius: 4px;
        transition: color 0.15s ease;
      }
      #bubble-close:hover {
        color: #ffffff;
      }
      #bubble-subtitle {
        font-size: 12px;
        font-weight: 400;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.82);
        margin-top: 5px;
        word-break: break-word;
      }
      #bubble-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      #bubble-actions.hidden {
        display: none !important;
      }
      .bubble-btn {
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.10);
        color: #ffffff;
        transition: all 0.15s ease;
      }
      .bubble-btn:hover {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.35);
      }
      .bubble-btn-allow {
        background: rgba(34, 197, 94, 0.22);
        border-color: rgba(34, 197, 94, 0.45);
        color: #86efac;
      }
      .bubble-btn-allow:hover {
        background: rgba(34, 197, 94, 0.35);
      }
      .bubble-btn-always {
        background: rgba(59, 130, 246, 0.22);
        border-color: rgba(59, 130, 246, 0.45);
        color: #93c5fd;
      }
      .bubble-btn-always:hover {
        background: rgba(59, 130, 246, 0.35);
      }
      .bubble-btn-deny {
        background: rgba(239, 68, 68, 0.22);
        border-color: rgba(239, 68, 68, 0.45);
        color: #fca5a5;
      }
      .bubble-btn-deny:hover {
        background: rgba(239, 68, 68, 0.35);
      }
      #bubble-tail {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 10px;
        pointer-events: none;
      }
      #bubble-tail svg {
        display: block;
      }
      #bubble-container.flipped #bubble-tail {
        order: -1;
        transform: rotate(180deg);
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(6px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="bubble-container" class="hidden">
      <div id="bubble-card">
        <div id="bubble-header">
          <div id="bubble-title"></div>
          <button id="bubble-close" title="Dismiss">×</button>
        </div>
        <div id="bubble-subtitle"></div>
        <div id="bubble-actions" class="hidden"></div>
      </div>
      <div id="bubble-tail">
        <svg width="20" height="10" viewBox="0 0 20 10">
          <polygon points="0,0 10,10 20,0" fill="rgba(20, 20, 24, 0.90)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1" />
        </svg>
      </div>
    </div>
    <canvas id="mochi"></canvas>
    <script type="module" src="/src/desktop/main.ts"></script>
  </body>
</html>
